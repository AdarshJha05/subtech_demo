<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<style>
html,body{margin:0;width:100%;max-width:100%}
body{overflow-x:clip;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
img,svg,video,canvas{max-width:100%;height:auto}
</style>
</head>
<body>
<x-dc>
<article ref="{{ rootRef }}" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" onMouseDown="{{ press }}" onMouseUp="{{ release }}" style="position:relative;display:flex;flex-direction:column;height:100%;background:#FFFFFF;border-radius:12px;overflow:hidden;font-family:'Inter',sans-serif;color:#0E1114;box-shadow:{{ shadow }};transform:{{ lift }};transition:transform 400ms cubic-bezier(.22,.8,.24,1),box-shadow 400ms cubic-bezier(.22,.8,.24,1)">
  <div style="position:relative;margin:12px 12px 0;aspect-ratio:4/3;border:1px solid #D5DBE0;border-radius:6px;overflow:hidden;background-color:#F6F7F8;background-image:linear-gradient(rgba(42,51,59,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(42,51,59,.05) 1px,transparent 1px);background-size:16px 16px">
    <a href="{{ p.href }}" aria-label="{{ p.name }} details" style="position:absolute;inset:0;display:block">
      <div style="position:absolute;inset:6% 8%;transform:{{ zoom }};transition:transform 400ms cubic-bezier(.22,.8,.24,1)">{{ p.art }}</div>
    </a>
    <div ref="{{ scanRef }}" style="position:absolute;left:0;right:0;top:-6%;height:2px;background:linear-gradient(90deg,transparent,#C8742E 30%,#FFB020 50%,#C8742E 70%,transparent);box-shadow:0 0 14px 2px rgba(200,116,46,.55);opacity:0;pointer-events:none"></div>
    <svg viewBox="0 0 100 75" preserveAspectRatio="none" style="position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);pointer-events:none;overflow:visible">
      <g fill="none" stroke="#B9C1C8" stroke-width="1" vector-effect="non-scaling-stroke">
        <path d="M0 6V0h6M94 0h6v6M100 69v6h-6M6 75H0v-6" vector-effect="non-scaling-stroke"></path>
      </g>
      <path d="M0 9V0h9M91 0h9v9M100 66v9h-9M9 75H0v-9" fill="none" stroke="#C8742E" stroke-width="2" vector-effect="non-scaling-stroke" pathLength="100" style="stroke-dasharray:25;stroke-dashoffset:{{ cornerOff }};transition:stroke-dashoffset 400ms cubic-bezier(.22,.8,.24,1)"></path>
    </svg>
    <span style="position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;height:24px;padding:0 9px;background:#12161A;color:#FFFFFF;border-radius:999px;font:700 11px/1 'JetBrains Mono',monospace;letter-spacing:.1em">{{ p.cat }}</span>
    <div style="position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px">
      <button type="button" onClick="{{ add }}" aria-label="{{ addLabel }}" title="{{ addLabel }}" style="width:44px;height:44px;border-radius:999px;border:1px solid #CDD3D9;background:{{ addBg }};color:{{ addFg }};display:grid;place-items:center;cursor:pointer;padding:0;transition:background 250ms,color 250ms,transform 150ms" style-active="transform:scale(.92)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14" style="opacity:{{ plusOp }};transition:opacity 150ms"></path>
          <path d="M5 12.5l4.5 4.5L19 7" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:{{ checkOff }};transition:stroke-dashoffset 400ms cubic-bezier(.22,.8,.24,1)"></path>
        </svg>
      </button>
      <sc-if value="{{ showCompare }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ p.onCompare }}" aria-label="Compare" title="{{ cmpLabel }}" style="width:44px;height:44px;border-radius:999px;border:1px solid #CDD3D9;background:{{ cmpBg }};color:{{ cmpFg }};display:grid;place-items:center;cursor:pointer;padding:0;transition:background 250ms,color 250ms">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"></path></svg>
        </button>
      </sc-if>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;flex:1;padding:18px 20px 22px;gap:10px">
    <div style="font:500 11.5px/1.2 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5B6670">{{ p.family }}</div>
    <a href="{{ p.href }}" style="text-decoration:none;color:#0E1114">
      <h3 style="margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:112%;font-size:22px;line-height:1.04;letter-spacing:-.015em;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ p.name }}</h3>
    </a>
    <div style="display:flex;flex-wrap:wrap;gap:6px;transform:{{ chipY }};transition:transform 250ms cubic-bezier(.22,.8,.24,1);min-height:26px">
      <sc-for list="{{ p.chips }}" as="c" hint-placeholder-count="2">
        <span style="display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:4px;background:#F1DCCB;color:#7A3F12;font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.02em">{{ c }}</span>
      </sc-for>
    </div>
    <p style="margin:0;font-size:14.5px;line-height:1.5;color:#5B6670;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ p.desc }}</p>
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:8px">
      <button type="button" onClick="{{ p.onQuote }}" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;background:#E2231A;color:#FFFFFF;border:0;border-radius:6px;font:700 13px/1 'Inter',sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:{{ quoteGlow }};transition:box-shadow 400ms,transform 150ms" style-active="transform:scale(.98)">Request Quote</button>
      <sc-if value="{{ review }}" hint-placeholder-val="{{ false }}">
        <span title="Hidden on live until a spec sheet PDF exists" style="display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1.5px dashed #E89A00;border-radius:6px;font:700 11.5px/1.15 'Inter',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#6B4200;background:#FFF8EA">Spec sheet · confirm</span>
      </sc-if>
      <a href="{{ p.href }}" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;font:700 13px/1 'Inter',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#0E1114;text-decoration:none">Details <span style="color:#C8742E">→</span></a>
    </div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#C8742E;transform-origin:left;transform:{{ barX }};transition:transform 400ms cubic-bezier(.22,.8,.24,1)"></div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:520},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;review&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showCompare&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { h: false, pr: false, seen: false };
  rootRef = React.createRef();
  scanRef = React.createRef();
  componentDidMount() {
    if (window.matchMedia && matchMedia('(hover: none)').matches && this.rootRef.current) {
      const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { this.setState({ seen: true }); io.disconnect(); } }, { threshold: .4 });
      io.observe(this.rootRef.current);
    }
  }
  renderVals() {
    const p = this.props.p || {};
    const { h, pr, seen } = this.state;
    const inQ = !!p.inQuote, cmp = !!p.compared;
    return {
      p, review: !!this.props.review, showCompare: !!this.props.showCompare,
      rootRef: this.rootRef, scanRef: this.scanRef,
      shadow: h ? '0 26px 48px -20px rgba(14,17,20,.45)' : '0 14px 34px -16px rgba(14,17,20,.28)',
      lift: pr ? 'translateY(-6px) scale(.99)' : h ? 'translateY(-6px)' : 'none',
      zoom: h ? 'scale(1.04)' : 'scale(1)',
      cornerOff: (h || seen) ? 0 : 25,
      chipY: h ? 'translateY(-4px)' : 'none',
      barX: h ? 'scaleX(1)' : 'scaleX(0)',
      quoteGlow: h ? '0 8px 24px -6px rgba(226,35,26,.55)' : 'none',
      addBg: inQ ? '#E2231A' : '#FFFFFF', addFg: inQ ? '#FFFFFF' : '#0E1114',
      plusOp: inQ ? 0 : 1, checkOff: inQ ? 0 : 1,
      addLabel: inQ ? 'Remove from quote list' : 'Add to quote list',
      cmpBg: cmp ? '#12161A' : '#FFFFFF', cmpFg: cmp ? '#FFFFFF' : '#0E1114',
      cmpLabel: cmp ? 'Remove from compare' : 'Compare',
      add: e => p.onAdd && p.onAdd(e),
      enter: () => {
        this.setState({ h: true });
        const s = this.scanRef.current;
        const rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (s && s.animate && !rm) s.animate([{ top: '-6%', opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: 1, offset: .88 }, { top: '104%', opacity: 0 }], { duration: 900, easing: 'cubic-bezier(.22,.8,.24,1)' });
      },
      leave: () => this.setState({ h: false, pr: false }),
      press: () => { this.setState({ pr: true }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ pr: false }), 80); },
      release: () => this.setState({ pr: false })
    };
  }
}
</script>
</body>
</html>
